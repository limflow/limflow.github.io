<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limflow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F1115;
      color: #F2EEE6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    h1 { font-size: 44px; letter-spacing: 1px; margin-bottom: 8px; }
    h1 span { color: #FF7A1A; }
    p { color: #B9B4A9; line-height: 1.5; margin-bottom: 28px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      color: #F2EEE6;
      text-decoration: none;
      border: 2px solid #2C2F38;
      padding: 10px 20px;
      border-radius: 12px;
      transition: border-color 0.2s, color 0.2s;
    }
    a:hover { border-color: #FF7A1A; color: #FF7A1A; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lim<span>flow</span></h1>
    <p>Привет, я Лимур. Учусь разрабатывать и вайб-кодить, делаю крутые штуки с помощью нейросетей.</p>
    <div class="links">
      <a href="https://t.me/Limflow">Telegram</a>
      <a href="https://github.com/Limflow">GitHub</a>
    </div>
  </div>
</body>
</html>
