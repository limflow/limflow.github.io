<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limflow — Лимур, разработчик</title>
  <meta name="description" content="Личная страница Лимура (Limflow): вайб-кодинг, проекты, ссылки на Telegram и GitHub.">
  <link rel="icon" type="image/png" href="limflow-mark-dark.png">
  <style>
    :root {
      --bg: #0F1115;        /* тёмный фон */
      --text: #F2EEE6;      /* кремовый текст */
      --muted: #B9B4A9;     /* приглушённый текст */
      --line: #2C2F38;      /* тонкие рамки */
      --accent: #FF7A1A;    /* оранжевый акцент */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 440px;
      animation: rise 0.6s ease both;
    }

    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;                 /* круг, как в Телеграме */
      display: block;
      margin: 0 auto 20px;
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--line);
    }

    h1 { font-size: 44px; letter-spacing: 1px; margin-bottom: 8px; }
    h1 span { color: var(--accent); }

    p { color: var(--muted); line-height: 1.55; margin-bottom: 26px; }

    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--text);
      text-decoration: none;
      border: 2px solid var(--line);
      padding: 10px 20px;
      border-radius: 12px;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }

    a:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* плавное появление карточки */
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    /* уважение к настройке "уменьшить движение" */
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="limflow-mark-light.png" alt="Знак Limflow: буква L и хвост лемура">
    <h1>Lim<span>flow</span></h1>
    <p>Привет, я Лимур. Учусь разрабатывать и вайб-кодить, делаю крутые штуки с помощью нейросетей.</p>
    <nav class="links">
      <a href="https://t.me/Limflow">Telegram</a>
      <a href="https://github.com/Limflow">GitHub</a>
    </nav>
  </main>
</body>
</html>
